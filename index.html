<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Document Assistant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        :root {
            --brand: #4f46e5;
            --brand-soft: #7c3aed;
            --page-bg: linear-gradient(160deg, #eef2ff 0%, #f8fafc 55%, #f5f3ff 100%);
        }

        [data-bs-theme="dark"] {
            --page-bg: linear-gradient(160deg, #0f172a 0%, #111827 55%, #1e1b4b 100%);
        }

        body {
            min-height: 100vh;
            background: var(--page-bg);
            background-attachment: fixed;
            transition: background 0.3s;
        }

        .app-header {
            background: linear-gradient(135deg, var(--brand), var(--brand-soft));
            color: white;
            border-radius: 20px;
            padding: 22px 26px;
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.25);
        }
        .app-header .logo {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        .app-header .btn-theme {
            background: rgba(255, 255, 255, 0.18);
            color: white;
            border: none;
        }
        .app-header .btn-theme:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .soft-card {
            border: 1px solid var(--bs-border-color-translucent);
            border-radius: 20px;
            background: var(--bs-body-bg);
            box-shadow: 0 6px 24px rgba(15, 23, 42, 0.06);
        }

        .section-title {
            font-weight: 600;
            font-size: 1rem;
        }

        .chat-box {
            height: 440px;
            overflow-y: auto;
            padding: 18px;
            border-radius: 16px;
            background: var(--bs-tertiary-bg);
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        .msg-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            max-width: 88%;
        }
        .msg-row.user { margin-left: auto; flex-direction: row-reverse; }
        .msg-row.ai { margin-right: auto; }

        .avatar {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            color: white;
        }
        .msg-row.user .avatar { background: #0ea5e9; }
        .msg-row.ai .avatar { background: linear-gradient(135deg, var(--brand), var(--brand-soft)); }

        .msg {
            padding: 11px 16px;
            border-radius: 18px;
            line-height: 1.55;
            word-wrap: break-word;
            overflow-wrap: anywhere;
        }
        .msg-row.user .msg {
            background: linear-gradient(135deg, var(--brand), var(--brand-soft));
            color: white;
            border-bottom-right-radius: 4px;
        }
        .msg-row.ai .msg {
            background: var(--bs-body-bg);
            border: 1px solid var(--bs-border-color-translucent);
            border-bottom-left-radius: 4px;
        }
        .msg-source {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed var(--bs-border-color);
            font-size: 0.8rem;
            color: var(--bs-secondary-color);
        }

        .typing span {
            display: inline-block;
            width: 7px;
            height: 7px;
            margin: 0 2px;
            border-radius: 50%;
            background: var(--bs-secondary-color);
            animation: bounce 1.2s infinite ease-in-out;
        }
        .typing span:nth-child(2) { animation-delay: 0.15s; }
        .typing span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
            40% { transform: translateY(-5px); opacity: 1; }
        }

        .form-control:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 0.2rem rgba(79, 70, 229, 0.18);
        }
        .btn-brand {
            background: linear-gradient(135deg, var(--brand), var(--brand-soft));
            border: none;
            color: white;
        }
        .btn-brand:hover { color: white; opacity: 0.92; }
        .btn-brand:disabled { color: white; opacity: 0.5; }

        @media (max-width: 576px) {
            .chat-box { height: 360px; }
            .msg-row { max-width: 96%; }
        }
    </style>
</head>
<body>

<div class="container py-4" style="max-width: 860px;">

    <div class="app-header d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center gap-3">
            <div class="logo"><i class="bi bi-file-earmark-text"></i></div>
            <div>
                <h4 class="mb-0 fw-bold">AI Document Assistant</h4>
                <small class="opacity-75">Upload a file and ask questions about it</small>
            </div>
        </div>
        <button id="themeToggle" class="btn btn-theme rounded-pill px-3">
            <i class="bi bi-moon-stars-fill me-1"></i> Dark Mode
        </button>
    </div>

    <div class="soft-card p-4 mb-4">
        <div class="section-title mb-3">
            <i class="bi bi-cloud-arrow-up me-2 text-primary"></i>Upload documents (PDF, DOCX, TXT, CSV)
        </div>
        <div class="input-group">
            <input type="file" class="form-control" id="fileInput" accept=".pdf,.docx,.txt,.csv">
            <button class="btn btn-brand px-4" id="uploadBtn">
                <i class="bi bi-upload me-1"></i> Upload
            </button>
        </div>
        <small id="uploadStatus" class="text-muted mt-2 d-block"></small>
        <div id="fileList" class="d-flex flex-wrap gap-2 mt-3"></div>
    </div>

    <div class="soft-card p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="section-title">
                <i class="bi bi-chat-dots me-2 text-primary"></i>Chat
            </div>
            <button id="clearBtn" class="btn btn-sm btn-outline-secondary rounded-pill">
                <i class="bi bi-trash3 me-1"></i> Clear
            </button>
        </div>

        <div id="chatBox" class="chat-box mb-3">
            <div class="msg-row ai">
                <div class="avatar"><i class="bi bi-robot"></i></div>
                <div class="msg">Hello! Upload a document first, then ask me anything about it.</div>
            </div>
        </div>

        <div class="input-group input-group-lg">
            <input type="text" id="userInput" class="form-control" placeholder="Ask a question..." disabled>
            <button class="btn btn-brand px-4" id="sendBtn" disabled>
                <i class="bi bi-send-fill"></i>
            </button>
        </div>
    </div>

</div>

<script src="app.js"></script>
</body>
</html>
